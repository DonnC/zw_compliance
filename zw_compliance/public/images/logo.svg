<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Zimbabwe Compliance</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8A55"/>
      <stop offset="1" stop-color="#05603A"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="256" height="256" rx="56" fill="url(#tile)"/>
  <!-- receipt with a torn bottom edge -->
  <path d="M72 44H184a8 8 0 0 1 8 8V196 l-8 -10 l-8 10 l-8 -10 l-8 10 l-8 -10 l-8 10 l-8 -10 l-8 10 l-8 -10 l-8 10 l-8 -10 l-8 10 l-8 -10 l-8 10 l-8 -10 l-8 10V52a8 8 0 0 1 8-8z" fill="#FFFFFF"/>
  <!-- flag band: yellow and red, as on the receipt header -->
  <rect x="64" y="62" width="128" height="6" fill="#FFD200"/>
  <rect x="64" y="68" width="128" height="4" fill="#D40000"/>
  <!-- text lines -->
  <rect x="80" y="90" width="64" height="9" rx="4.5" fill="#1F2937"/>
  <rect x="80" y="110" width="96" height="7" rx="3.5" fill="#9CA3AF"/>
  <rect x="80" y="126" width="80" height="7" rx="3.5" fill="#9CA3AF"/>
  <!-- QR mark -->
  <g fill="#1F2937">
    <rect x="80" y="146" width="16" height="16" rx="2"/>
    <rect x="102" y="146" width="7" height="7" rx="1"/>
    <rect x="102" y="155" width="7" height="7" rx="1"/>
    <rect x="80" y="168" width="7" height="7" rx="1"/>
    <rect x="89" y="168" width="7" height="7" rx="1"/>
    <rect x="111" y="164" width="11" height="11" rx="2"/>
  </g>
  <!-- accepted: gold badge with a check -->
  <circle cx="178" cy="178" r="38" fill="#FFD200" stroke="#05603A" stroke-width="8"/>
  <path d="M160 179l12 12 24-26" fill="none" stroke="#111827" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
